name: Deploy lfc-admin

on:
  push:
    branches:
      - development
      - master
    paths:
      - 'client/admin/lfc-web/**'
      - '.github/workflows/deploy-lfc-admin.yml'

jobs:
  build-lfc-admin:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Build lfc-admin
        run: |
          cd client/admin/lfc-web
          pnpm install
          pnpm run build

      - name: Package lfc-admin
        run: |
          cd client/admin/lfc-web
          zip -r lfc-admin-build.zip dist

      - name: Upload lfc-admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfc-admin-build
          path: client/admin/lfc-web/lfc-admin-build.zip

  deploy-lfc-admin:
    name: deploy
    runs-on: ubuntu-latest
    needs: build-lfc-admin
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lfc-admin-build
          path: ./build-output

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy lfc-admin
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_NAME" = "development" ]; then
            ENV_DIR="dev"
          elif [ "$GITHUB_REF_NAME" = "staging" ]; then
            ENV_DIR="staging"
          elif [ "$GITHUB_REF_NAME" = "master" ]; then
            ENV_DIR="prod"
          else
            echo "❌ Unsupported branch: $GITHUB_REF_NAME"
            exit 1
          fi

          SERVER_PATH="/www/project/Lfc/client/admin/lfc-web/$ENV_DIR"

          echo "📦 Deploy lfc-admin → $SERVER_PATH"

          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "mkdir -p $SERVER_PATH"

          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./build-output/lfc-admin-build.zip $SSH_USER@$SSH_HOST:$SERVER_PATH/

          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
            cd $SERVER_PATH &&
            unzip -o lfc-admin-build.zip &&
            rm -f lfc-admin-build.zip
          "
